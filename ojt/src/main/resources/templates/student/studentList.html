<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title layout:fragment="title">Student List</title>
</head>
<body class="bg-light">
<div layout:fragment="content">
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4">Student List</h4>


                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">No</th>
                        <th scope="col">Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Age</th>
                        <th scope="col">Gender</th>
                        <th scope="col">Address</th>
                        <th scope="col" class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="student, iterStat : ${studentList}">
                        <td th:text="${iterStat.index + 1}">1</td>
                        <td th:text="${student.name}">John Doe</td>
                        <td th:text="${student.email}">john@example.com</td>
                        <td th:text="${student.age}">20</td>
                        <td th:text="${student.genderString }">Male</td>
                        <td th:text="${student.address}">Yangon</td>
                        <td class="text-center">
                            <a th:href="@{/edit/{id}(id=${student.studentId})}"
                               class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/delete/{id}(id=${student.studentId})}"
                               class="btn btn-sm btn-danger">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>


                <div th:if="${studentList == null or studentList.isEmpty()}" class="text-center text-muted">
                    <p> Students Not Found</p>
                </div>

                <div class="mt-3 text-end">
                    <a th:href="@{/add}" class="btn btn-primary">Add New Student</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
